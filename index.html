<!DOCTYPE html>
<html>
  <head>
    <title>Hopper-II - Image to Excalidraw </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header><h1>Hopper-II <br> Image to Excalidraw </h1></header>
    <main>
      <aside>
        <div>
          <b>File to Convert :</b>
        </div>
        <label for="source" class="custom-file-upload">Select a File</label>
        <input type="file" id="source" accept=".png, .jpg, .jpeg" />
        <div>
          <b>Smoothness Scale :</b>
          <input id="smoothness" type="range"  value="30" min="1" max="100" step="1" />
          <p>Value: <output id="value"></output></p>
            <img style="width:150px" id="loadedimg" src=""/>
            
            
            <button class="button" id="convertButton" onclick="run_pipeline()">Convert</button> 
            <button class="button"id="stylizeButton" onclick="stylize()">Reduce Colors then Convert</button> 
            <button class="button" id="copyButton" onclick="copyToClipboard()">Copy to Clipboard</button> 
       
            
        </div>
        
      
      </aside>
        <div>
            <textarea
              id="result"
              placeholder="The result, in excalidraw file format, will be shown here!"
              style="font-size: 17px;"
            ></textarea>
              
        </div>
    </main>
    <script src="js/imagetracer_v1.2.6.js"></script>
    <script src="js/svg-to-excalidraw_vLIS.js"></script>
    <script src="js/jquery.js"></script>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.21.0/full/pyodide.js"></script>

  </body>
</html>
