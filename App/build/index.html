<!DOCTYPE html>
<html>
  <head>
    <title>Hopper-II - Image to Excalidraw </title>
    <link rel="stylesheet" href="\static\style.css">
  </head>
  <body>
    <header><h1>Hopper-II <br> Image to Excalidraw </h1></header>
    <main>
      <aside>
        <div>
          <b>File to convert :</b>
        </div>
        <label for="source" class="custom-file-upload">Select a file</label>
        <input type="file" id="source" accept=".png, .jpg, .jpeg" />
        <div>
          <b>Smoothness Scale :</b>
          <input id="smoothness" type="range"  value="30" min="1" max="100" step="1" />
          <p>Value: <output id="value"></output></p>
        </div>
        
        <img style="width:80%" id="loadedimg" src=""/>

      </aside>
      
      <textarea
        id="result"
        placeholder="The result, in excalidraw file format, will be shown here!"
        style="font-size: 17px;"
      ></textarea>
      <button id="convertButton" onclick="run_pipeline()">Convert</button> 
      <button id="stylizeButton" onclick="stylize()">Stylize Image</button> 
      <button id="copyButton" onclick="copyToClipboard()">Copy To Clipboard</button>

    </main>
    <script src="\static\js\imagetracer_v1.2.6.js"></script>
  <script src="\static\js\svg-to-excalidraw_vLIS.js"></script>
  <script src="\static\js\jquery.js"></script>
  <script src="\static\js\testing.js"></script>
  </body>
</html>
